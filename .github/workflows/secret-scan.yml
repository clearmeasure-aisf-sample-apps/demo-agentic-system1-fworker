# No secret in the repository (capability CAP-055): gitleaks over the whole history of the commit each pull request
# and push checks out (--log-opts=HEAD), not every branch, so a finding on one branch fails that branch only.
# A required check of the default-branch ruleset. The command-line tool, not gitleaks-action, which needs a license
# for organization repositories.
name: secret-scan

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1 --log-opts="HEAD"
